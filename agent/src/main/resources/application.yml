server:
  port: 8081

spring:
  application:
    name: hdfs-file-transfer-agent
  main:
    allow-circular-references: true

hdfs:
  transfer:
    server:
      base-url: http://localhost:8080
      heartbeat-interval: 10
    agent:
      max-parallel-tasks: 3
      log-batch-size: 50
      log-collect-interval: 5
      retry-enabled: true
      retry-max-count: 3
      work-dir: /opt/hdfs-transfer/agent/work
      # Hadoop 安装路径，用于执行 hadoop distcp / hadoop fs 等命令
      hadoop-home: /opt/cloudera/parcels/CDH/lib/hadoop
      # YARN 可执行文件路径，用于恢复任务时查询 YARN 作业状态，默认 {hadoop-home}/bin/yarn
      yarn-bin: /opt/cloudera/parcels/CDH/lib/hadoop-yarn
      # Task timeout in hours, 0 = no timeout
      task-timeout-hours: 0
